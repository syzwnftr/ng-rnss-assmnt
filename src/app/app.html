<div style="display: flex; justify-content: center; margin-top: 2rem; padding-bottom: 1rem;">
  <mat-tab-group style="width: 1000px;">
    <mat-tab label="Angular Question" style="margin-top: 1rem;">
      <div style="text-align:center; margin-top: 1.5rem;">
        <h2>Angular Question</h2>
        <button class="show-table-btn" (click)="showTable()">
          {{isShowTable ? 'Hide Table' : 'Show Table'}}
        </button>
      </div>

      <div style="margin-top: 20px;">
        @if(isShowTable) {
        <table border="1" cellpadding="10" style="margin: auto;">
          <thead>
            <tr>
              <th>No</th>
              <th>Name</th>
              <th>Age</th>
              <th>Nationality</th>
            </tr>
          </thead>
          <tbody>
            @for(person of people; track person.no) {
            <tr>
              <td>{{ person.no }}</td>
              <td>{{ person.name }}</td>
              <td>{{ person.age }}</td>
              <td>
                @if(person.age > 30) {
                <ng-container>
                  {{ person.nationality || 'Loading...' }}
                </ng-container>
                }
                @else {
                <ng-container>
                  -
                </ng-container>
                }
              </td>
            </tr>
            }
          </tbody>
        </table>
        }
      </div>
    </mat-tab>
    <mat-tab label="SQL Question">
      <div style="text-align:center; margin-top: 1.5rem;">
        <h2>SQL Question</h2>
      </div>
      <app-sql-question></app-sql-question>
    </mat-tab>
    <mat-tab label=".Net Question">
      <div style="text-align:center; margin-top: 1.5rem;">
        <h2>.Net Question</h2>
      </div>
      <app-dot-net-question></app-dot-net-question>
    </mat-tab>
  </mat-tab-group>
</div>
